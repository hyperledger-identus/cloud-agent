name: Unit tests

# Cancel previously running workflows if new commit pushed to the branch
# this will help to push fixes earlier and stop previous workflows
concurrency:
  group: ${{ github.head_ref }}${{ github.ref }}-unit-tests
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build-and-unit-tests:
    name: "Build and unit tests"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SBT_OPTS: -Xmx2G
      DOCKER_API_VERSION: "1.44"
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Git checkout (merge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - name: Git checkout (PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          # see: https://frontside.com/blog/2020-05-26-github-actions-pull_request/#how-does-pull_request-affect-actionscheckout
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21 (Temurin) with sbt cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.2.0 pinned
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@d059c39de700f4cc5cb64f9f56577315e44a984e # v1.1.18 pinned

      - name: Download dependencies
        run: sbt +update

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Run unit tests
        env:
          HOME: /root
        # NOTE: under sbt 2.x the scoverage `coverage` command must be separated from the following
        # commands with `;` (not spaces), otherwise sbt joins them and the `coverage` command's
        # internal `set` consumes the next command ("value test is not a member of Boolean").
        run: |
          sbt -v "coverage; test; coverageAggregate"

      - name: Upload coverage to Coveralls
        continue-on-error: true # coverage upload is a metric, not a gate; don't fail the build on a flaky aggregation
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: cobertura
          path-to-lcov: target/out/jvm/scala-3.3.5/root/coverage/coverage-report/cobertura.xml
          flag-name: unit
          allow-empty: true

      - name: Aggregate test reports
        if: always()
        uses: ./.github/actions/aggregate-test-reports

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          junit_files: "./target/test-reports/**/TEST-*.xml"
          comment_title: "Unit Test Results"
          check_name: "Unit Test Results"
