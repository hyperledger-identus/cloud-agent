name: Publish Identus-cloud-agent clients

run-name: Build and publish Identus Cloud Agent clients from ${{ github.head_ref || github.ref_name }} run ${{ github.run_number }}

on:
  workflow_call:
    inputs:
      release:
        description: "Release to build and publish clients"
        required: true
        type: boolean
      kotlin:
        description: 'Publish Kotlin client'
        type: boolean
        default: true
      ts:
        description: 'Publish TypeScript client'
        type: boolean
        default: true
      revision:
        description: "Revision to build and publish clients"
        required: true
        type: string
      source_run_id:
        description: 'Build run containing the revision OAS artifact'
        required: false
        type: string
      check_sum:
        description: "Checksum of the OAS specification"
        required: false
        type: string
    secrets:
      HYP_BOT_GPG_PRIVATE:
        required: true
      HYP_BOT_GPG_PASSWORD:
        required: true
      OSSRH_USERNAME:
        required: true
      OSSRH_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: 'Is a release publication?'
        required: true
        type: boolean
        default: false
      revision:
        description: "Revision to build and publish clients"
        required: true
        type: string
      kotlin:
        description: 'Publish kotlin client'
        required: false
        type: boolean
        default: true
      ts:
        description: 'Publish ts client'
        required: false
        type: boolean
        default: true
      check_sum:
        description: "Checksum of the OAS specification"
        required: false
        type: string
      source_run_id:
        description: 'Build run containing the revision OAS artifact (required for manual snapshots)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-clients:
    name: "Build and publish Identus Cloud Agent clients"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_ACTOR: "hyperledger-bot"
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: "22.16.0"
          registry-url: "https://registry.npmjs.org"
          scope: "@hyperledger"

      # Ensure npm version ≥ 11.5.1 for Trusted Publishing
      - name: Upgrade npm
        run: |
          URL="https://registry.npmjs.org/npm/-/npm-11.5.1.tgz"
          EXPECTED_HASH="f4c82fbff74154f73bd5ce5a2b749700d55eaddebda97b16076bf7033040de34"
          curl -sSfL "$URL" -o npm.tgz
          echo "$EXPECTED_HASH npm.tgz" | sha256sum -c -
          npm install -g npm.tgz
          rm npm.tgz

      - name: Setup Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3.5.0
        with:
          gradle-version: '8.12.1'

      - name: Validate publication inputs
        env:
          REVISION: ${{ inputs.revision }}
          RELEASE: ${{ inputs.release }}
          CHECK_SUM: ${{ inputs.check_sum }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "Revision must be a semantic version" >&2
            exit 1
          fi
          if [[ "$RELEASE" != "true" ]]; then
            if [[ "$REVISION" != *-* || ! "$CHECK_SUM" =~ ^[a-f0-9]{8}$ || ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Revision publication requires a prerelease version, OAS checksum, and source_run_id" >&2
              exit 1
            fi
          fi

      - name: Download release OAS
        if: ${{ inputs.release }}
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          curl --proto '=https' --proto-redir '=https' -fSL "https://raw.githubusercontent.com/hyperledger-identus/cloud-agent/refs/tags/v${REVISION}/cloud-agent/service/api/http/cloud-agent-openapi-spec.yaml" \
            -o ./cloud-agent/service/api/http/cloud-agent-openapi-spec.yaml

      - name: Download OpenAPI specification
        if: ${{ !inputs.release }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          name: cloud-agent-openapi-spec-${{ inputs.check_sum }}
          path: ./cloud-agent/service/api/http

      - name: Verify revision OAS checksum
        if: ${{ !inputs.release }}
        env:
          CHECK_SUM: ${{ inputs.check_sum }}
        run: |
          checksum=$(sha256sum ./cloud-agent/service/api/http/cloud-agent-openapi-spec.yaml | cut -c1-8)
          test "$checksum" = "$CHECK_SUM"

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Generator
        working-directory: cloud-agent/client/generator
        run: |
          YARN_ENABLE_SCRIPTS=false yarn install --frozen-lockfile --ignore-scripts
          yarn generate:all

      # The npm publish step uses Trusted Publisher via OIDC
      - name: Publish clients (npm Trusted Publisher)
        working-directory: cloud-agent/client/generator
        env:
          VERSION_TAG: ${{ inputs.revision }}
          PUBLISH_KOTLIN: ${{ inputs.kotlin }}
          PUBLISH_TS: ${{ inputs.ts }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.HYP_BOT_GPG_PRIVATE }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.HYP_BOT_GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          echo "Using npm version $(npm -v)"
          npm audit signatures
          yarn publish:clients
